name: Update Bangalore Gold Rates

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Goodreturns Bangalore rate
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from datetime import datetime, timezone

          url = "https://www.goodreturns.in/gold-rates/bangalore.html"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0 (compatible; GoldCalculator/1.0)"}
          )
          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")

          # Goodreturns exposes the Bangalore 24K/22K/18K values in the page HTML.
          # Extract the first matching values near the current-page rate labels.
          patterns = {
              "24K": [
                  r'24K\s*Gold\s*/g.*?₹\s*([\d,]+)',
                  r'24K.*?₹\s*([\d,]+).*?22K',
              ],
              "22K": [
                  r'22K\s*Gold\s*/g.*?₹\s*([\d,]+)',
                  r'22K.*?₹\s*([\d,]+).*?18K',
              ],
              "18K": [
                  r'18K\s*Gold\s*/g.*?₹\s*([\d,]+)',
                  r'18K.*?₹\s*([\d,]+)',
              ],
          }

          rates = {}
          for key, pats in patterns.items():
              for pat in pats:
                  m = re.search(pat, html, re.I | re.S)
                  if m:
                      value = int(m.group(1).replace(",", ""))
                      if 1000 < value < 30000:
                          rates[key] = value
                          break

          if set(rates) != {"24K", "22K", "18K"}:
              raise SystemExit(f"Could not parse all Bangalore rates: {rates}")

          data = {
              "city": "Bangalore",
              "source": "Goodreturns",
              "rates": rates,
              "updated": datetime.now(timezone.utc).strftime("%d %b %Y %H:%M UTC")
          }

          with open("rates.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          print(data)
          PY

      - name: Commit changed rate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "Update Bangalore gold rates"
          git push
